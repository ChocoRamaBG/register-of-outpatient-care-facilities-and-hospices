name: Autonomous Medical Registry Scraper

on:
  workflow_dispatch:

# CRITICAL: Permissions required to commit tracking files and trigger workflows
permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Extract City Nomenclatures
        run: python city_code_names.py

      - name: Execute Autonomous Deep Scrape
        run: python main.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add processed_ids.txt
          git add FINAL_DOCTORS_DATA.xlsx
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update processed_ids.txt and extracted medical data"
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "CONTINUE_FLAG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "Autonomous Medical Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
