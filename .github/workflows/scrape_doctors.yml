name: Autonomous Medical Registry Scraper

on:
  workflow_dispatch:

# CRITICAL: Permissions required to commit tracking files and trigger workflows
permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Extract City Nomenclatures
        run: python city_code_names.py

      - name: Execute Autonomous Deep Scrape
        run: python main.py

      - name: Archive and Upload Extracted Data
        uses: actions/upload-artifact@v4
        with:
          # Adding run_id ensures each batch is saved uniquely and not overwritten
          name: Final-Medical-Data-Output-Batch-${{ github.run_id }}
          path: |
            *.xlsx
            processed_ids.txt
          if-no-files-found: warn

      - name: Commit Progress Tracker
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add processed_ids.txt
          
          # We only commit the .txt file so the next runner knows what is done.
          # We DO NOT commit the .xlsx files here to prevent repository size bloat.
          if git diff --staged --quiet; then
            echo "No new IDs to commit."
          else
            git commit -m "Auto-save state: Update processed_ids.txt"
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "CONTINUE_FLAG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "Autonomous Medical Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
