name: "(Registry Agency) Autonomous Scraper"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: registry-agency-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./registry_agency_scraper
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Autonomous Deep Scrape
        run: python -u scraper_registry_agency.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p registry_agency_outputs
          touch registry_agency_outputs/processed_uics_registry.txt
          
          git add registry_agency_outputs/processed_uics_registry.txt
          
          if [ -f "registry_agency_outputs/savegame_registry_agency.json" ]; then
            git add -f registry_agency_outputs/savegame_registry_agency.json
          fi
          
          if [ -f "registry_agency_outputs/registry_agency_data_mega.csv" ]; then
            git add -f registry_agency_outputs/registry_agency_data_mega.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update registry_agency extracted data"
            git pull --rebase origin main
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "registry_agency_outputs/CONTINUE_FLAG_REGISTRY_AGENCY" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(Registry Agency) Autonomous Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
