name: (his.bg) Autonomous Medical Registry Scraper

on:
  schedule:
    # Runs automatically at 02:00 UTC on the 1st of every month
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./hisbg_scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Extract City Nomenclatures
        run: python city_code_names.py

      - name: Execute Autonomous Incremental Scrape
        run: python scraper_hisbg.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          mkdir -p hisbg_outputs
          touch hisbg_outputs/hisbg_processed_ids.txt

          git add hisbg_outputs/hisbg_processed_ids.txt

          if [ -f "hisbg_outputs/HISBG_FINAL_DOCTORS_DATA.xlsx" ]; then
            git add -f hisbg_outputs/HISBG_FINAL_DOCTORS_DATA.xlsx
          fi

          if [ -f "hisbg_outputs/hisbg_city_dump.xlsx" ]; then
            git add -f hisbg_outputs/hisbg_city_dump.xlsx
          fi

          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Incremental update of his.bg registry data"
            git pull --rebase origin main
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "hisbg_outputs/CONTINUE_FLAG_HISBG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(his.bg) Autonomous Medical Registry Scraper"
          else
            echo "No continue flag detected. Incremental update is 100% complete."
          fi
