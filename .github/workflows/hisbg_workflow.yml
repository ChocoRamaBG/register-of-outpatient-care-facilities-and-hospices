name: (his.bg) Autonomous Medical Registry Scraper

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Това е магията - казваме на стъпките да се изпълняват директно в новата папка
    defaults:
      run:
        working-directory: ./hisbg_scraper
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Extract City Nomenclatures
        run: python city_code_names.py

      - name: Execute Autonomous Deep Scrape
        # Ако си преименувал main.py на scraper_hisbg.py, промени го и тук!
        run: python main.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Папката hisbg_outputs ще се създаде вътре в hisbg_scraper
          mkdir -p hisbg_outputs
          touch hisbg_outputs/hisbg_processed_ids.txt
          
          git add hisbg_outputs/hisbg_processed_ids.txt
          
          if [ -f "hisbg_outputs/HISBG_FINAL_DOCTORS_DATA.xlsx" ]; then
            git add hisbg_outputs/HISBG_FINAL_DOCTORS_DATA.xlsx
          fi
          
          if [ -f "hisbg_outputs/hisbg_city_dump.xlsx" ]; then
            git add hisbg_outputs/hisbg_city_dump.xlsx
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update his.bg processed IDs and extracted medical data"
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "hisbg_outputs/CONTINUE_FLAG_HISBG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "Autonomous Medical Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
