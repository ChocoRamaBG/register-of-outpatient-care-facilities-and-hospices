name: (lekaribg.net) Autonomous Registry Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: lekaribg-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lekaribg_scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager pandas selenium

      - name: Execute Autonomous Deep Scrape
        run: python scraper_lekaribg.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p lekaribg_outputs
          touch lekaribg_outputs/parsed_urls_lekaribg.txt
          
          git add lekaribg_outputs/parsed_urls_lekaribg.txt
          
          if [ -f "lekaribg_outputs/savegame_lekaribg.json" ]; then
            git add -f lekaribg_outputs/savegame_lekaribg.json
          fi
          
          if [ -f "lekaribg_outputs/lekaribg_data_mega.csv" ]; then
            git add -f lekaribg_outputs/lekaribg_data_mega.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update lekaribg extracted data"
            
            git pull --rebase origin main
            
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "lekaribg_outputs/CONTINUE_FLAG_LEKARIBG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(lekaribg) Autonomous Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
