name: Autonomous Medical Registry Scraper

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Extract City Nomenclatures
        run: python city_code_names.py

      - name: Execute Autonomous Deep Scrape
        run: python main.py

      - name: Archive and Upload Extracted Data
        uses: actions/upload-artifact@v4
        with:
          name: Final-Medical-Data-Output
          path: |
            *.xlsx
            processed_ids.txt
          if-no-files-found: warn
