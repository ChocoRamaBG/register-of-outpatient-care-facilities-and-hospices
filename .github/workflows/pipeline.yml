name: Medical Registry Automation Pipeline

# Този тригър (workflow_dispatch) създава бутона "Run workflow" за ръчно стартиране с един клик.
on:
  workflow_dispatch:

jobs:
  data-extraction-and-processing:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Required Libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl

      - name: Step 1 - Execute Base Extraction (The Heist)
        run: python run_local_heist.py

      - name: Step 2 - Fetch Nomenclatures (Care Types & Cities)
        run: |
          python fetch_care_types.py
          python fetch_cities.py

      - name: Step 3 - Execute Deep Scrape & Data Enrichment
        run: python main_loop.py

      - name: Upload Final Excel Files as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Final-Medical-Registry-Data
          path: |
            *.xlsx
            processed_ids.txt
          if-no-files-found: warn
