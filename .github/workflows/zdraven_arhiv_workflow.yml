name: (zdraven_arhiv.com) Autonomous Registry Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: zdraven-arhiv-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./zdraven_arhiv_scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager pandas selenium

      - name: Execute Autonomous Deep Scrape
        run: python scraper_zdraven_arhiv.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p zdraven_arhiv_outputs
          touch zdraven_arhiv_outputs/parsed_urls_zdraven_arhiv.txt
          
          git add zdraven_arhiv_outputs/parsed_urls_zdraven_arhiv.txt
          
          if [ -f "zdraven_arhiv_outputs/savegame_zdraven_arhiv.json" ]; then
            git add -f zdraven_arhiv_outputs/savegame_zdraven_arhiv.json
          fi

          # ДОБАВЕНО: Запазване на черния списък с пропуснатите страници
          if [ -f "zdraven_arhiv_outputs/failed_pages_zdraven_arhiv.json" ]; then
            git add -f zdraven_arhiv_outputs/failed_pages_zdraven_arhiv.json
          fi
          
          if [ -f "zdraven_arhiv_outputs/zdraven_arhiv_data_mega.csv" ]; then
            git add -f zdraven_arhiv_outputs/zdraven_arhiv_data_mega.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update zdraven_arhiv extracted data"
            git pull --rebase origin main
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "zdraven_arhiv_outputs/CONTINUE_FLAG_ZDRAVEN_ARHIV" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(zdraven_arhiv.com) Autonomous Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
