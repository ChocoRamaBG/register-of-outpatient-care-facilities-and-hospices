name: Autonomous BLS BG Archive Scraper

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *'

permissions:
  contents: write
  actions: write

jobs:
  run-blsbg-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous BLS BG Deep Scrape
        run: python scraper_blsbg.py

      - name: Upload Debug Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug-files
          path: |
            *.png
            *.html
            blsbg_outputs/*.txt
          retention-days: 3

      - name: Commit Progress Tracker and Data
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Създаваме файла, ако скриптът не е стигнал до запис, за да не гърми git add
          mkdir -p blsbg_outputs
          touch blsbg_outputs/processed_blsbg_pages.txt
          git add blsbg_outputs/processed_blsbg_pages.txt
          
          if [ -f "blsbg_outputs/bg_medics_dynamic_2029.xlsx" ]; then
            git add blsbg_outputs/bg_medics_dynamic_2029.xlsx
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update BLS BG processed pages and extracted medical data"
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "============================================================"
            echo "ERROR: PAT_TOKEN IS MISSING, YOU TOTAL NOOB!"
            echo "Go to Repo Settings -> Secrets and variables -> Actions"
            echo "Add a new secret named PAT_TOKEN with your GitHub PAT."
            echo "============================================================"
            exit 1
          fi

          if [ -f "blsbg_outputs/CONTINUE_FLAG_BLSBG" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "Autonomous BLS BG Archive Scraper"
          else
            echo "No continue flag detected. BLS BG scraping is 100% complete."
          fi
