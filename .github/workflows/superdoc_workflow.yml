name: (superdoc.bg) Autonomous Registry Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: superdoc-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./superdoc_scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager pandas selenium

      - name: Execute Autonomous Deep Scrape
        run: python scraper_superdoc.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p superdoc_outputs
          touch superdoc_outputs/parsed_urls_superdoc.txt
          
          git add superdoc_outputs/parsed_urls_superdoc.txt
          
          if [ -f "superdoc_outputs/savegame_superdoc.json" ]; then
            git add -f superdoc_outputs/savegame_superdoc.json
          fi
          
          if [ -f "superdoc_outputs/superdoc_data_mega.csv" ]; then
            git add -f superdoc_outputs/superdoc_data_mega.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update superdoc extracted data"
            
            git pull --rebase origin main
            
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "superdoc_outputs/CONTINUE_FLAG_SUPERDOC" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(superdoc) Autonomous Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
