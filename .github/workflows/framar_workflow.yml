name: "(framar.bg) Autonomous Registry Scraper"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Стартира всеки ден в 03:00 UTC

concurrency:
  group: framar-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./framar_scraper
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Autonomous Deep Scrape
        run: python scraper_framar.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p framar_outputs
          touch framar_outputs/parsed_urls_framar.txt
          
          git add framar_outputs/parsed_urls_framar.txt
          
          if [ -f "framar_outputs/savegame_framar.json" ]; then
            git add -f framar_outputs/savegame_framar.json
          fi

          if [ -f "framar_outputs/failed_pages_framar.json" ]; then
            git add -f framar_outputs/failed_pages_framar.json
          fi

          if [ -f "framar_outputs/failed_profiles_framar.json" ]; then
            git add -f framar_outputs/failed_profiles_framar.json
          fi
          
          if [ -f "framar_outputs/framar_doctors_full.csv" ]; then
            git add -f framar_outputs/framar_doctors_full.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update framar.bg extracted data"
            git pull --rebase origin main
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "framar_outputs/CONTINUE_FLAG_FRAMAR" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(framar.bg) Autonomous Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
