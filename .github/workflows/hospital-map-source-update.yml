# Generated locally by integrations/github-source-events/generate_workflow.py.
# Install this file as .github/workflows/hospital-map-source-update.yml on main.
name: Update hospital map from changed source files

on:
  push:
    branches: [main]
    paths:
      - "blsbg_scraper/blsbg_outputs/bg_medics_dynamic_2029.xlsx"
      - "hapchebg_scraper/hapchebg_outputs/hapchebg_data_mega.csv"
      - "framar_scraper/framar_outputs/framar_doctors_full.csv"
      - "zdraveopazvane_scraper/zdraveopazvane_outputs/zdraveopazvane_doctors_full.csv"
      - "lekaribg_scraper/lekaribg_outputs/lekaribg_data_mega.csv"
      - "zdraven_arhiv_scraper/zdraven_arhiv_outputs/zdraven_arhiv_data_mega.csv"
      - "superdoc_scraper/superdoc_outputs/superdoc_data_mega.csv"
      - "hisbg_scraper/hisbg_outputs/HISBG_FINAL_DOCTORS_DATA.xlsx"
      - "hisbg_scraper/hisbg_outputs/hisbg_city_dump.xlsx"
  # Scraper commits made with GITHUB_TOKEN do not trigger on:push.
  # The local bridge checks configured source content before requesting a build.
  workflow_run:
    workflows:
      - "(blsbg.eu) Autonomous BLS BG Archive Scraper"
      - "(hapche.bg) Autonomous Registry Scraper"
      - "(framar.bg) Autonomous Registry Scraper"
      - "(zdraveopazvaneto.bg) Autonomous Registry Scraper"
      - "(lekaribg.net) Autonomous Registry Scraper"
      - "(zdraven_arhiv.com) Autonomous Registry Scraper"
      - "(superdoc.bg) Autonomous Registry Scraper"
      - "(his.bg) Autonomous Medical Registry Scraper"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-map-source-refresh
  cancel-in-progress: false

jobs:
  update-local-website:
    if: >-
      github.repository == 'ChocoRamaBG/register-of-outpatient-care-facilities-and-hospices' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'ChocoRamaBG/register-of-outpatient-care-facilities-and-hospices' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: [self-hosted, Windows, X64, hospital-map-sources]
    steps:
      - name: Refresh changed source data using the installed local pipeline
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:HOSPITAL_MAP_ROOT)) {
            throw 'Set HOSPITAL_MAP_ROOT in the local runner environment before starting the runner.'
          }
          $root = (Resolve-Path -LiteralPath $env:HOSPITAL_MAP_ROOT).Path
          $bridge = Join-Path $root 'integrations\github-source-events\Invoke-GitHubSourceRefresh.ps1'
          if (-not (Test-Path -LiteralPath $bridge -PathType Leaf)) {
            throw 'The local GitHub source event bridge is missing.'
          }
          & $bridge -Root $root
          if ($LASTEXITCODE -ne 0) { throw 'The local website source refresh failed.' }
