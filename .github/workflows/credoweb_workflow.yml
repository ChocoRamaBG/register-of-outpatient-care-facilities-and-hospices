name: "(credoweb.bg) Autonomous Registry Scraper"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *' # Стартира всеки ден в 04:00 UTC

concurrency:
  group: credoweb-scraper
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./credoweb_scraper
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Playwright Browsers
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Execute Autonomous Deep Scrape
        run: python scraper_credoweb.py

      - name: Commit Progress Tracker and Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          mkdir -p credoweb_outputs
          touch credoweb_outputs/parsed_urls_credoweb.txt
          
          git add credoweb_outputs/parsed_urls_credoweb.txt
          
          if [ -f "credoweb_outputs/savegame_credoweb.json" ]; then
            git add -f credoweb_outputs/savegame_credoweb.json
          fi

          if [ -f "credoweb_outputs/failed_pages_credoweb.json" ]; then
            git add -f credoweb_outputs/failed_pages_credoweb.json
          fi

          if [ -f "credoweb_outputs/failed_profiles_credoweb.json" ]; then
            git add -f credoweb_outputs/failed_profiles_credoweb.json
          fi
          
          if [ -f "credoweb_outputs/credoweb_doctors_full.csv" ]; then
            git add -f credoweb_outputs/credoweb_doctors_full.csv
          fi

          if [ -f "credoweb_outputs/credoweb_hospitals_full.csv" ]; then
            git add -f credoweb_outputs/credoweb_hospitals_full.csv
          fi
          
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "Auto-save state: Update credoweb.bg extracted data"
            git pull --rebase origin main
            git push
          fi

      - name: Check Continue Flag and Trigger Next Run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "credoweb_outputs/CONTINUE_FLAG_CREDOWEB" ]; then
            echo "Continue flag detected. Script hit time limit. Triggering next workflow run..."
            gh workflow run "(credoweb.bg) Autonomous Registry Scraper"
          else
            echo "No continue flag detected. Scraping is 100% complete."
          fi
