name: "(registry_agency) Data Filler"

on:
  # Позволява САМО ръчно стартиране на скрипта от бутон в GitHub UI
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    # Задаваме работната директория, за да може всички run команди
    # автоматично да се изпълняват в папката на скрипта.
    defaults:
      run:
        working-directory: register-of-outpatient-care-facilities-and-hospices/registry_agency_scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run the UIC finder script
        run: |
          python eik_extractor.py

      - name: Commit and Push state and outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Пътят е правилен, защото сме в директорията на скрипта
          git add registry_agency_outputs/
          
          git commit -m "Auto-update: Добавени нови ЕИК номера и обновен прогрес" || echo "Няма нови промени за къмитване"
          git push

      - name: Check for continuation flag and re-trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "registry_agency_outputs/CONTINUE_FLAG_UIC_FINDER" ]; then
            echo "Времевият лимит беше достигнат. Рестартираме екшъна за продължаване..."
            # Името тук трябва да съвпада точно с 'name:' стойността в началото на файла
            gh workflow run "(registry_agency) Data Filler"
          else
            echo "Всички комбинации са приключени. Край на процеса."
          fi
