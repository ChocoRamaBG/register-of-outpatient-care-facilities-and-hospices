name: Run MyHealth Scraper

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI
  schedule:
    - cron: '0 2 * * *' # Optional: Runs every day at 02:00 UTC (uncomment if daily sync is needed)

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager pandas selenium openpyxl

      - name: Run Scraper
        env:
          CI: true # This triggers the headless configuration in the script
        run: |
          cd myhealth_scraper
          python scraper_myhealth.py

      - name: Upload Scraped Data
        uses: actions/upload-artifact@v4
        with:
          name: myhealth-scraped-data
          path: myhealth_scraper/myhealth_data.xlsx
          retention-days: 7
