name: Run MyHealth Scraper

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scrape'
        required: true
        default: 'https://myhealth.bg/search/?page=164'
  schedule:
    - cron: '0 2 * * *'

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install webdriver-manager pandas selenium openpyxl

      - name: Run Scraper
        env:
          CI: true
          TARGET_URL: ${{ github.event.inputs.target_url || 'https://myhealth.bg/search/?page=164' }}
        run: |
          cd myhealth_scraper
          python scraper_myhealth.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myhealth-run-results
          path: |
            myhealth_scraper/myhealth_data.xlsx
            myhealth_scraper/debug_screenshot.png
          if-no-files-found: ignore
          retention-days: 7
