name: MyHealth Scraper

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: myhealth-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Show Chrome versions
        run: |
          echo "Chrome version:"
          ${{ steps.setup-chrome.outputs.chrome-path }} --version

          echo "ChromeDriver version:"
          ${{ steps.setup-chrome.outputs.chromedriver-path }} --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pandas openpyxl

      - name: Run scraper
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: python myhealth_scraper/scraper_myhealth.py

      - name: Upload Excel output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myhealth-headless-output
          path: myhealth_scraper/myhealth_headless.xlsx
          if-no-files-found: warn
          retention-days: 14
