name: Queue new hospital names for manual standardization

on:
  push:
    branches: [main]
    paths:
      - '**/*_outputs/**'
      - '.github/scripts/facility-dictionary/**'
      - '.github/workflows/facility-dictionary.yml'
  # Scrapers use GITHUB_TOKEN to commit outputs, which does not trigger push
  # workflows. Check the latest trusted main after every scraper completion,
  # including runs that committed partial results before failing or timing out.
  workflow_run:
    workflows:
      - '(blsbg.eu) Autonomous BLS BG Archive Scraper'
      - '(hapche.bg) Autonomous Registry Scraper'
      - '(framar.bg) Autonomous Registry Scraper'
      - '(zdraveopazvaneto.bg) Autonomous Registry Scraper'
      - '(lekaribg.net) Autonomous Registry Scraper'
      - '(zdraven_arhiv.com) Autonomous Registry Scraper'
      - '(superdoc.bg) Autonomous Registry Scraper'
      - '(his.bg) Autonomous Medical Registry Scraper'
      - '(credoweb.bg) Autonomous Registry Scraper'
      - '(registry_agency) Autonomous Scraper'
      - '(registry_agency) Data Filler'
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facility-dictionary-main
  cancel-in-progress: false

jobs:
  append-pending-names:
    # No fork/PR code, event-supplied scripts, artifacts, or source branches run
    # with write credentials. Always check out and scan the current main branch.
    if: >-
      github.repository == 'ChocoRamaBG/register-of-outpatient-care-facilities-and-hospices' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          # Source HTML snapshots are intentionally excluded. Future output
          # CSV/XLSX/XLSM files remain visible to the collector's discovery.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/facility-dictionary/
            /unconnected_datasets/standartized_medical_centres_and_types.csv
            **/*_outputs/**/*.[cC][sS][vV]
            **/*_outputs/**/*.[xX][lL][sS][xX]
            **/*_outputs/**/*.[xX][lL][sS][mM]
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install openpyxl==3.1.5
      - name: Append new raw names with blank decision cells
        shell: bash
        env:
          DICTIONARY: unconnected_datasets/standartized_medical_centres_and_types.csv
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config remote.origin.promisor true
          git config remote.origin.partialclonefilter blob:none
          for attempt in 1 2 3; do
            git fetch --filter=blob:none --depth=1 origin main
            # This isolated runner has only our previous generated commit and
            # no user edits. A retry rescans the new main and preserves its rows.
            git checkout -B facility-dictionary-sync origin/main
            python .github/scripts/facility-dictionary/facility_dictionary_sync.py \
              --root . \
              --manifest .github/scripts/facility-dictionary/sources.json \
              --cache-dir "$RUNNER_TEMP/facility-dictionary-cache" \
              --report "$RUNNER_TEMP/facility-dictionary-report.json"
            if git diff --quiet -- "$DICTIONARY"; then
              echo 'No new facility names. Existing manual decisions are unchanged.'
              exit 0
            fi
            git add -- "$DICTIONARY"
            git commit -m 'Queue new hospital names for manual standardization'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed while appending (attempt $attempt of 3); retrying with its latest dictionary."
          done
          echo 'The dictionary could not be published after 3 attempts. Rerun this workflow.' >&2
          exit 1
